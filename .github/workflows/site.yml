# Construit et publie app.pi-appliance.com (spécification 2 et 3) : récupère
# docs/ de pi-appliance à sa dernière étiquette vX.Y.Z, la convertit avec
# outils/site.mjs, essaie le site dans Chromium (outils/essai.cjs), puis le
# publie par GitHub Pages. Chaque jour, à chaque changement de main, et à la
# demande. Un site inchangé garde la même empreinte : les téléphones ne
# retéléchargent rien.

name: Site

on:
  push:
    branches: [main]
  schedule:
    # Toutes les heures : une nouvelle version de pi-appliance arrive dans
    # l'application sans attendre un changement de main (2026-11-23 : la
    # documentation était restée en v0.1.14) ; rien n'est republié si la
    # version en ligne est déjà la dernière.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    outputs:
      a_jour: ${{ steps.verif.outputs.a_jour }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dernière version de pi-appliance
        id: pi
        run: |
          set -euo pipefail
          depot=https://github.com/gmoulard/pi-appliance.git
          etiquette=$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname "$depot" 'v*' \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          test -n "$etiquette"
          git clone --quiet --depth 1 --branch "$etiquette" "$depot" pi-appliance
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C pi-appliance rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git -C pi-appliance log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
          echo "Documentation de pi-appliance $etiquette"

      - name: Déjà à jour ?
        id: verif
        env:
          ETIQUETTE: ${{ steps.pi.outputs.etiquette }}
          SITE: https://gmoulard.github.io/pi-appliance-pwa/version.json
        run: |
          set -u
          a_jour=false
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            en_ligne=$(curl -fsSL "$SITE" | jq -r '.version + " " + .app_commit' 2>/dev/null || true)
            if [ "$en_ligne" = "$ETIQUETTE $GITHUB_SHA" ]; then a_jour=true; fi
            echo "En ligne : ${en_ligne:-illisible} ; attendu : $ETIQUETTE $GITHUB_SHA"
          fi
          echo "a_jour=$a_jour" >> "$GITHUB_OUTPUT"

      - name: Construction
        if: steps.verif.outputs.a_jour != 'true'
        run: |
          npm ci --prefix outils
          node outils/site.mjs --docs pi-appliance/docs \
            --version "${{ steps.pi.outputs.etiquette }}" \
            --commit "${{ steps.pi.outputs.commit }}" \
            --date "${{ steps.pi.outputs.date }}" \
            --app-commit "${GITHUB_SHA}" --app-date "$(git log -1 --format=%cs)" \
            --out _site

      - name: Essais dans Chromium
        if: steps.verif.outputs.a_jour != 'true'
        run: |
          npm install --no-save --prefix outils playwright@1.63.0
          npx --prefix outils playwright install --with-deps chromium
          node outils/essai.cjs _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.verif.outputs.a_jour != 'true'
        with:
          path: _site

  publier:
    needs: construire
    if: needs.construire.outputs.a_jour != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
