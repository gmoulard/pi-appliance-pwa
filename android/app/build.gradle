plugins {
    id "com.android.application"
}

def paquet = providers.gradleProperty("paquet").get()
def hote = providers.gradleProperty("hote").get()
def numero = (System.getenv("NUMERO_VERSION") ?: "1") as int
def cle = System.getenv("ANDROID_KEYSTORE_FICHIER")
def declaration = """[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "https://${hote}"}}]"""

android {
    namespace = paquet
    compileSdk = 36

    defaultConfig {
        applicationId = paquet
        minSdk = 26
        targetSdk = 36
        versionCode = numero
        versionName = "1.${numero}"
        manifestPlaceholders = [hote: hote]
        // NE PAS retirer le remplacement des guillemets : sans \" devant, Android les enlève de la ressource et Chrome ne lit plus la déclaration.
        resValue "string", "assetStatements", declaration.replace('"', '\\"')
    }

    signingConfigs {
        if (cle) {
            publication {
                storeFile = file(cle)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            if (cle) {
                signingConfig = signingConfigs.publication
            }
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
